<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Playlist Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🎵 Music Playlist Manager</h1>

        <div id="nowPlayingBanner" class="now-playing">
            No song currently playing.
        </div>

        <div class="card">
            <h3>Add Song</h3>
            <div class="form-group">
                <label>Song Title</label>
                <input type="text" id="titleInput" placeholder="e.g., Starboy">
            </div>
            <div class="form-group">
                <label>Artist Name</label>
                <input type="text" id="artistInput" placeholder="e.g., The Weeknd">
            </div>
            <div class="form-group">
                <label>Duration (mins)</label>
                <input type="number" step="0.01" id="durationInput" placeholder="e.g., 3.50">
            </div>
            <button onclick="alert('UI ready! Next we will link this to your Java backend.')">Add Song to Playlist</button>
        </div>

        <div class="card">
            <h3>Playback Controls</h3>
            <div class="grid-buttons">
                <button onclick="alert('Play Next action')">Play Next ⏭</button>
                <button onclick="alert('Search action')">Search Song 🔍</button>
            </div>
        </div>

        <div class="card">
            <h3 id="playlistHeader">Current Playlist (0 songs)</h3>
            <ul id="playlistContainer" class="playlist-items">
                <!-- Items populate here dynamically -->
            </ul>
        </div>
    </div>

</body>
</html>
